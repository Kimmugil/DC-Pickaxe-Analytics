# 분석: 매일 13:00(KST)에 어제 글을 분석한다. 월요일엔 지난주 주간, 매월 1일엔 지난달 월간 리포트도 만든다.
name: analyze
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: analyze
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 일간
        run: python -m analyzer daily
      - name: 주간 (월요일)
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then python -m analyzer weekly; fi
      - name: 월간 (1일)
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then python -m analyzer monthly; fi
