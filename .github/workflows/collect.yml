# 디시 갤러리 수집: 매시간. 갤러리별 수집 간격은 관리자 화면 설정을 따르고, 차단이 의심되면 스스로 쉰다.
name: collect
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
